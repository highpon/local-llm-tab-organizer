<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Tab Tidy</title>
<meta name="color-scheme" content="light dark">
<style>
  :root { color-scheme: light dark; }
  body { font: 13px system-ui, sans-serif; width: 340px; margin: 0; padding: 10px; }
  button { font: inherit; margin-right: 4px; }
  section { margin: 10px 0; }
  h2 { font-size: 13px; margin: 0 0 4px; }
  ul { margin: 2px 0 6px; padding-left: 18px; max-height: 120px; overflow-y: auto; }
  li { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .muted { opacity: .7; }
  .error { color: #c33; }
</style>
</head>
<body>
<div>
  <button id="run">今すぐ実行</button>
  <button id="undo">元に戻す</button>
  <button id="options">設定</button>
</div>
<div id="message" class="muted" role="status"></div>
<div id="pending"></div>
<section><h2>直近の実行</h2><div id="last" class="muted"></div></section>
<section><h2>LLM の状態</h2><div id="llm" class="muted"></div></section>
<script type="module" src="./main.ts"></script>
</body>
</html>
