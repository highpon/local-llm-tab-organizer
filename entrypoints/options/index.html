<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title data-i18n="optionsTitle">Tab Tidy settings</title>
<meta name="color-scheme" content="light dark">
<style>
  :root { color-scheme: light dark; }
  body { font: 14px system-ui, sans-serif; max-width: 640px; margin: 16px auto; padding: 0 12px; }
  fieldset { margin: 12px 0; }
  label { display: block; margin: 6px 0; }
  input[type=text], input[type=url], input[type=number], select { font: inherit; }
  input[type=url], input[name=model] { width: 24em; max-width: 100%; }
  table { border-collapse: collapse; width: 100%; }
  th, td { border-bottom: 1px solid #8884; padding: 3px 6px; text-align: left; }
  .error { color: #c33; }
  .muted { opacity: .7; }
  #status { margin-left: 8px; }
</style>
</head>
<body>
<h1 data-i18n="optionsTitle"></h1>
<form id="form" novalidate>
  <fieldset>
    <legend data-i18n="dedupeLegend"></legend>
    <label><span data-i18n="modeLabel"></span>
      <select id="dedupeMode"></select>
    </label>
    <label><input type="checkbox" id="acrossWindows"> <span data-i18n="acrossWindowsLabel"></span></label>
  </fieldset>
  <fieldset>
    <legend data-i18n="groupingLegend"></legend>
    <label><span data-i18n="modeLabel"></span>
      <select id="groupingMode"></select>
    </label>
  </fieldset>
  <fieldset>
    <legend data-i18n="llmLegend"></legend>
    <label><input type="checkbox" id="llmEnabled"> <span data-i18n="llmEnabledLabel"></span></label>
    <label><span data-i18n="baseUrlLabel"></span> <input type="url" id="baseUrl"></label>
    <label><span data-i18n="modelLabel"></span> <input type="text" id="model" name="model" list="models" autocomplete="off"></label>
    <datalist id="models"></datalist>
    <label><span data-i18n="timeoutLabel"></span> <input type="number" id="timeoutSeconds" min="1" step="1"></label>
    <button type="button" id="test" data-i18n="testButton"></button>
    <div id="testResult" role="status"></div>
  </fieldset>
  <fieldset>
    <legend data-i18n="scheduleLegend"></legend>
    <label><span data-i18n="intervalLabel"></span> <input type="number" id="intervalMinutes" min="1" step="1"></label>
    <label><span data-i18n="idleLabel"></span> <input type="number" id="idleSeconds" min="15" step="1"></label>
  </fieldset>
  <button type="submit" id="save" data-i18n="save"></button><span id="status" role="status"></span>
</form>
<h2 data-i18n="historyHeading"></h2>
<table>
  <thead><tr><th data-i18n="colTime"></th><th data-i18n="colTrigger"></th><th data-i18n="colClosed"></th><th data-i18n="colGrouped"></th><th data-i18n="colMethod"></th><th data-i18n="colNotes"></th></tr></thead>
  <tbody id="history"></tbody>
</table>
<script type="module" src="./main.ts"></script>
</body>
</html>
