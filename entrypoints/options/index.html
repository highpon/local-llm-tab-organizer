<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Tab Tidy 設定</title>
<meta name="color-scheme" content="light dark">
<style>
  :root { color-scheme: light dark; }
  body { font: 14px system-ui, sans-serif; max-width: 640px; margin: 16px auto; padding: 0 12px; }
  fieldset { margin: 12px 0; }
  label { display: block; margin: 6px 0; }
  input[type=text], input[type=url], input[type=number], select { font: inherit; }
  input[type=url], input[name=model] { width: 24em; max-width: 100%; }
  table { border-collapse: collapse; width: 100%; }
  th, td { border-bottom: 1px solid #8884; padding: 3px 6px; text-align: left; }
  .error { color: #c33; }
  .muted { opacity: .7; }
  #status { margin-left: 8px; }
</style>
</head>
<body>
<h1>Tab Tidy 設定</h1>
<form id="form" novalidate>
  <fieldset>
    <legend>重複タブの統合</legend>
    <label>モード
      <select id="dedupeMode"></select>
    </label>
    <label><input type="checkbox" id="acrossWindows"> ウィンドウをまたいで統合する</label>
  </fieldset>
  <fieldset>
    <legend>グループ分け</legend>
    <label>モード
      <select id="groupingMode"></select>
    </label>
  </fieldset>
  <fieldset>
    <legend>LLM（Ollama など OpenAI 互換 API）</legend>
    <label><input type="checkbox" id="llmEnabled"> LLM を使って分類する</label>
    <label>ベース URL <input type="url" id="baseUrl"></label>
    <label>モデル <input type="text" id="model" name="model" list="models" autocomplete="off"></label>
    <datalist id="models"></datalist>
    <label>タイムアウト（秒） <input type="number" id="timeoutSeconds" min="1" step="1"></label>
    <button type="button" id="test">接続テスト</button>
    <div id="testResult" role="status"></div>
  </fieldset>
  <fieldset>
    <legend>実行スケジュール</legend>
    <label>実行間隔（分） <input type="number" id="intervalMinutes" min="1" step="1"></label>
    <label>アイドル判定（秒、15 以上） <input type="number" id="idleSeconds" min="15" step="1"></label>
  </fieldset>
  <button type="submit" id="save">保存</button><span id="status" role="status"></span>
</form>
<h2>実行履歴</h2>
<table>
  <thead><tr><th>日時</th><th>契機</th><th>閉じた</th><th>グループ化</th><th>方式</th><th>備考</th></tr></thead>
  <tbody id="history"></tbody>
</table>
<script type="module" src="./main.ts"></script>
</body>
</html>
